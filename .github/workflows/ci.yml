name: C++ Two Sum CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build and test on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          g++ -std=c++20 -Wall -Wextra src/main.cpp src/twosum.cpp -o twosum_test
          ./twosum_test

      - name: Install compiler, build, and test on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install mingw -y
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          & "$env:ProgramData\mingw64\mingw64\bin\g++.exe" -std=c++20 -Wall -Wextra src/main.cpp src/twosum.cpp -o twosum_test.exe
          .\twosum_test.exe
